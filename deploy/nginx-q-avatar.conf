# 80 端口：只做两件事——给 Let's Encrypt 读取验证文件，其他请求一律跳转到 https。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：网站本体。证书由 certbot 申请和续期（IP 证书约 6 天有效，自动续期见 deploy/README.md）。
server {
    # nginx 1.24 的写法；1.25 以后改成单独一行 http2 on;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/q-avatar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/q-avatar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 先用 1 天，确认 https 稳定后再调长（浏览器会在这段时间里拒绝退回 http）
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/q-avatar/dist;
    index index.html;

    # 后端接口：转发给本机 8787，真实来源 IP 放在 X-Real-IP
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # 打包后的静态文件带哈希，可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 单页应用：其他路径都回到 index.html，由前端路由处理
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
